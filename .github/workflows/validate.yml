# ตรวจข้อมูล รันเทสต์ และลองสร้างเว็บ กับทุก pull request (อ่านอย่างเดียว ไม่ deploy)
name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install analysis dependency (pinned by hash)
        run: "python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-analysis.txt"

      - name: Validate data
        run: python scripts/validate_csv.py data/thai_lottery.csv

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build site
        run: python scripts/build_site.py data/thai_lottery.csv web _site
