# เพิ่มงวดใหม่จาก API ของกองสลากฯ ทุกวัน แล้วสร้างและ deploy เว็บไซต์ขึ้น GitHub Pages
# ผลออกประมาณ 14:30–16:00 น. เวลาไทย จึงรันเวลา 17:00 และ 21:00 น. (10:00 และ 14:00 UTC)
# และ 09:00 น. ของวันถัดไป (02:00 UTC) เผื่อ API ล่มหรือประกาศผลช้า
#
# ความปลอดภัย:
# - สิทธิ์เริ่มต้นเป็นศูนย์ แต่ละ job ขอเท่าที่ต้องใช้ (เขียน repo เฉพาะ job update, deploy เฉพาะ job deploy)
# - actions ทุกตัวปักไว้ที่ commit SHA (แท็กถูกย้ายได้ SHA ย้ายไม่ได้)
# - ข้อมูลต้องผ่าน validate_csv.py ก่อน commit และก่อนสร้างเว็บ ถ้าไม่ผ่าน จะไม่ commit/ไม่ deploy
# - numpy (dependency เดียวของ analysis engine) ติดตั้งแบบ --require-hashes จาก requirements-analysis.txt
#
# การทำนาย (ดู MODEL.md):
# - หลังเพิ่มงวดใหม่: ประเมิน snapshot ที่รอผล → คำนวณ backtest ใหม่ (ถ้าข้อมูล/config/โค้ดเปลี่ยน)
#   → สร้าง snapshot ของงวดถัดไป (ก่อนวันออกรางวัล) แล้ว commit พร้อมข้อมูล
# - snapshot/ผลประเมินที่มีอยู่แล้วห้ามถูกแก้หรือลบ ถ้ามีการแก้ job จะล้มและไม่ commit
# - ตั้งค่า GitHub: Settings → Pages → Source = "GitHub Actions"
name: Update lottery results and deploy site

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "config/**"
      - "requirements-analysis.txt"
      - ".github/workflows/update.yml"

permissions: {}

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install analysis dependency (pinned by hash)
        run: "python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-analysis.txt"

      - name: Fetch new draws from glo.or.th
        run: python scripts/update_from_glo.py data/thai_lottery.csv raw/glo

      - name: Validate data before commit
        run: python scripts/validate_csv.py data/thai_lottery.csv

      - name: Evaluate pending prediction snapshots
        run: python scripts/lotto_predict.py evaluate

      - name: Update backtest (only if data, config or model code changed)
        run: python scripts/lotto_predict.py backtest

      - name: Create snapshot for the next draw (only if missing and before the draw)
        run: python scripts/lotto_predict.py snapshot

      - name: Refuse changes to existing snapshots and evaluations
        run: |
          changed=$(git diff --name-only --diff-filter=MDR -- data/predictions data/evaluations)
          if [ -n "$changed" ]; then
            echo "::error::existing snapshot/evaluation files were modified or deleted: $changed"
            exit 1
          fi

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No new draws, snapshots or evaluations."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/thai_lottery.csv raw/glo data/metadata data/predictions data/evaluations data/analysis; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          latest=$(tail -n 1 data/thai_lottery.csv | cut -d, -f1)
          git commit -m "Update data up to ${latest} (results, evaluations, backtest, snapshot)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "Data up to ${latest}"
            git show --stat --format= HEAD
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: update
    # สร้างเว็บเมื่อมีงวดใหม่ เมื่อสั่งรันเอง หรือเมื่อมีการแก้โค้ด/ข้อมูลบน main
    if: github.ref == 'refs/heads/main' && (needs.update.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main  # รวม commit งวดใหม่ที่ job update เพิ่งดันขึ้นไป
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install analysis dependency (pinned by hash)
        run: "python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-analysis.txt"

      - name: Validate data
        run: python scripts/validate_csv.py data/thai_lottery.csv

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build site
        run: python scripts/build_site.py data/thai_lottery.csv web _site

      - name: Summary
        run: |
          python -c "import json;m=json.load(open('_site/data/manifest.json',encoding='utf-8'));print(f\"Built {m['draw_count']} draws up to {m['latest_draw']}, version {m['version']}, csv sha256 {m['csv_sha256']}\")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
